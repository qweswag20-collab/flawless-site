.hash{

<script>
(function(){
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var c = document.getElementById("bg"), ctx = c.getContext("2d");
  var W, H, P = [], mx = 0, my = 0, last = performance.now();
  var COLORS = [[161,132,255],[96,217,235],[116,225,178]];
  function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  function spawn(n){
    for (var i = 0; i < n; i++) P.push({
      x: Math.random()*W, y: Math.random()*H, z: .3 + Math.random()*.7,
      vx: (Math.random()-.5)*9, vy: 7 + Math.random()*15,
      r: Math.random()*1.8 + .5, c: COLORS[i % COLORS.length],
      a: .07 + Math.random()*.15, tw: Math.random()*Math.PI*2
    });
  }
  function step(now){
    requestAnimationFrame(step);
    if (document.hidden){ last = now; return; }
    var dt = Math.min((now - last) / 1000, .05); last = now;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++){
      var p = P[i];
      p.x += p.vx*dt + mx*14*p.z; p.y += p.vy*dt + my*9*p.z; p.tw += dt*2;
      if (p.y > H + 20){ p.y = -20; p.x = Math.random()*W; }
      if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      var a = p.a * (.7 + .3*Math.sin(p.tw));
      var r = p.r * (1 + p.z);
      ctx.fillStyle = "rgba(" + p.c[0] + "," + p.c[1] + "," + p.c[2] + "," + a + ")";
      ctx.fillRect(p.x, p.y, r, r);
    }
  }
  resize(); spawn(90);
  addEventListener("resize", resize);
  addEventListener("mousemove", function(e){
    mx = e.clientX/innerWidth - .5; my = e.clientY/innerHeight - .5;
  });
  if (reduce){
    for (var i = 0; i < P.length; i++){
      var p = P[i];
      ctx.fillStyle = "rgba(" + p.c[0] + "," + p.c[1] + "," + p.c[2] + "," + p.a + ")";
      ctx.fillRect(p.x, p.y, p.r, p.r);
    }
  } else requestAnimationFrame(step);

  document.querySelectorAll("[data-copy]").forEach(function(btn){
    var label = btn.textContent;
    btn.addEventListener("click", function(){
      var text = btn.getAttribute("data-copy");
      var done = function(ok){
        btn.textContent = ok ? "Скопировано" : "Не вышло";
        setTimeout(function(){ btn.textContent = label; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(); });
      } else fallback();
      function fallback(){
        try{
          var ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          var ok = document.execCommand("copy"); ta.remove(); done(ok);
        } catch(e){ done(false); }
      }
    });
  });

  if ("IntersectionObserver" in window && !reduce){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { threshold: .12 });
    document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll(".reveal").forEach(function(el){ el.classList.add("in"); });
  }
})();
</script>
